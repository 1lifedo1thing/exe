# The exe homepage, inside the VM: installed by publish.sh as
# /etc/nginx/sites-available/exe-site. exe's proxy hands the public
# hostname's requests to this port; `current` is a symlink publish.sh
# swaps, so a publish is one rename and nginx is never reloaded for it.

# Every request arrives from exe's proxy, so the peer address says
# nothing: log the visitor as Cloudflare reports it, and the tunnel
# connector that carried the request (exe's proxy puts its own peer, the
# cloudflared host, in X-Forwarded-For), which is how one tells the
# tunnel's replicas apart when one of them misbehaves.
log_format exe_site '$http_cf_connecting_ip via $http_x_forwarded_for [$time_iso8601] '
                    '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/exe-site/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/exe-site.access.log exe_site;

    add_header X-Content-Type-Options nosniff always;

    # the page is revalidated on every visit, so a publish shows at once;
    # the pictures may sit at the edge and in the browser for four hours,
    # which is what the zone's Browser Cache TTL makes of anything shorter
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    location ~* \.(png|svg|ico|jpg|webp)$ {
        expires 4h;
    }
}
